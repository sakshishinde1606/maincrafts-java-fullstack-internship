<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maincrafts &mdash; Contact Management</title>
<script src="/js/api.js"></script>
<style>
  :root{
    --ink:#0f1720;
    --blueprint:#12233b;
    --blueprint-line: rgba(255,255,255,0.06);
    --paper:#f4f1ea;
    --amber:#e08a2c;
    --amber-soft:#f2c98e;
    --slate:#7c8ba1;
    --red:#e0552c;
    --green:#4caf7d;
    --display: 'Georgia', 'Iowan Old Style', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:var(--body); color:var(--paper);
    background:var(--blueprint);
    background-image: linear-gradient(var(--blueprint-line) 1px, transparent 1px), linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:28px 8vw; flex-wrap:wrap; gap:12px;}
  .brand{font-family:var(--mono); letter-spacing:2px; font-size:14px; text-transform:uppercase; color:var(--amber-soft);}
  .brand span{color:var(--paper); font-weight:bold;}
  header a{color:var(--slate); text-decoration:none; font-family:var(--mono); font-size:13px;}
  header a:hover{color:var(--paper);}
  .logout-btn{background:none; border:1px solid var(--slate); color:var(--paper); font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:2px; cursor:pointer;}

  main{padding:2vh 8vw 8vh;}
  .eyebrow{font-family:var(--mono); color:var(--amber); font-size:13px; letter-spacing:3px; text-transform:uppercase; border-left:2px solid var(--amber); padding-left:12px; margin-bottom:20px;}
  h1{font-family:var(--display); font-size:clamp(1.8rem, 4vw, 2.6rem); margin:0 0 8px; font-weight:400;}
  .sub{color:var(--slate); margin-bottom:28px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;}
  .btn{padding:10px 18px; border-radius:2px; border:none; cursor:pointer; font-family:var(--mono); font-size:13px; letter-spacing:.5px;}
  .btn-primary{background:var(--amber); color:var(--ink); font-weight:600;}
  .btn-primary:hover{background:var(--amber-soft);}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}
  .btn-danger:hover{background:var(--red); color:var(--paper);}
  .btn-small{padding:6px 12px; font-size:12px;}

  #status{font-family:var(--mono); font-size:13px; color:var(--slate); margin-bottom:16px;}

  .table-wrap{border:1px solid rgba(255,255,255,0.12); border-radius:4px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; background:rgba(255,255,255,0.02); min-width:760px;}
  thead th{
    text-align:left; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--amber-soft); padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:hover{color:var(--paper);}
  thead th.sortable::after{content:' \2195'; opacity:.4; font-size:11px;}
  thead th.sort-asc::after{content:' \2191'; opacity:1;}
  thead th.sort-desc::after{content:' \2193'; opacity:1;}
  tbody td{padding:12px 16px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.06); vertical-align:top; max-width:220px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.03);}
  .id-cell{color:var(--slate); font-family:var(--mono);}
  .actions-cell{white-space:nowrap;}
  .actions-cell button{margin-right:6px;}
  .status-pill{font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:12px; border:1px solid; display:inline-block;}
  .status-pending{color:var(--amber-soft); border-color:var(--amber);}
  .status-resolved{color:var(--green); border-color:var(--green);}

  .pagination{display:flex; align-items:center; gap:14px; margin-top:18px; font-family:var(--mono); font-size:13px; color:var(--slate);}
  .pagination button{background:none; border:1px solid var(--slate); color:var(--paper); padding:7px 14px; border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:13px;}
  .pagination button:disabled{opacity:.35; cursor:not-allowed;}
  .pagination button:not(:disabled):hover{border-color:var(--paper);}

  /* Modal */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{background:var(--blueprint); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:28px; width:100%; max-width:440px;}
  .modal h3{font-family:var(--display); margin-top:0; font-size:1.4rem;}
  .field{margin-bottom:16px;}
  label{display:block; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--amber-soft); margin-bottom:7px;}
  input, textarea, select{width:100%; padding:10px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15); border-radius:2px; color:var(--paper); font-family:var(--body); font-size:14px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--amber);}
  textarea{min-height:80px; resize:vertical;}
  .field-error{color:var(--red); font-size:12px; font-family:var(--mono); margin-top:6px; min-height:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .btn-secondary{background:none; border:1px solid var(--slate); color:var(--paper);}
  .btn-secondary:hover{border-color:var(--paper);}
</style>
</head>
<body>

<header>
  <div class="brand"><span>MAIN</span>CRAFTS</div>
  <div style="display:flex; gap:20px; align-items:center;">
    <a href="/index.html">&larr; Back to landing page</a>
    <span id="whoami" style="font-family:var(--mono); font-size:12px; color:var(--slate);"></span>
    <button type="button" class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <div class="eyebrow">Full Stack &middot; Task 06</div>
  <h1>Contact Management System</h1>
  <p class="sub">View, create, edit, and delete contacts &mdash; with pagination &amp; sorting.</p>

  <div class="toolbar">
    <div id="status">Loading contacts&hellip;</div>
    <button class="btn btn-primary" id="addBtn">+ Add Contact</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th class="sortable" data-sort="name">Name</th>
          <th class="sortable" data-sort="email">Email</th>
          <th>Message</th>
          <th class="sortable" data-sort="status">Status</th>
          <th class="sortable" data-sort="createdAt">Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="contactTable"></tbody>
    </table>
  </div>

  <div class="pagination">
    <button id="prevBtn">&larr; Prev</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Next &rarr;</button>
  </div>
</main>

<!-- Add / Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Contact</h3>
    <form id="contactForm">
      <input type="hidden" id="contactId">
      <div class="field">
        <label for="cname">Name</label>
        <input type="text" id="cname">
        <div class="field-error" id="err-name"></div>
      </div>
      <div class="field">
        <label for="cemail">Email</label>
        <input type="text" id="cemail">
        <div class="field-error" id="err-email"></div>
      </div>
      <div class="field">
        <label for="cmessage">Message</label>
        <textarea id="cmessage"></textarea>
        <div class="field-error" id="err-message"></div>
      </div>
      <div class="field">
        <label for="cstatus">Status</label>
        <select id="cstatus">
          <option value="PENDING">Pending</option>
          <option value="RESOLVED">Resolved</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const tableBody = document.getElementById('contactTable');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const form = document.getElementById('contactForm');
  const pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentPage = 0;
  const pageSize = 10;
  let sortField = 'createdAt';
  let sortDir = 'desc';
  let totalPages = 1;
  let lastPageData = [];

  function clearFieldErrors() {
    ['name', 'email', 'message'].forEach(id => document.getElementById('err-' + id).textContent = '');
  }

  async function loadContacts() {
    statusEl.textContent = 'Loading contacts...';
    try {
      const url = `/contacts?page=${currentPage}&size=${pageSize}&sort=${sortField},${sortDir}`;
      // apiFetch (js/api.js) attaches the JWT automatically and redirects
      // to /login.html on its own if the token is missing/expired.
      const res = await apiFetch(url);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const data = await res.json();

      totalPages = data.totalPages || 1;
      lastPageData = data.content || [];
      tableBody.innerHTML = '';

      if (lastPageData.length === 0) {
        statusEl.textContent = 'No contacts found.';
      } else {
        statusEl.textContent = `${data.totalElements} contact${data.totalElements === 1 ? '' : 's'} total.`;
        lastPageData.forEach(c => {
          const row = document.createElement('tr');
          const created = c.createdAt ? new Date(c.createdAt).toLocaleString() : '';
          const statusClass = c.status === 'RESOLVED' ? 'status-resolved' : 'status-pending';
          row.innerHTML = `
            <td class="id-cell">#${c.id}</td>
            <td>${c.name}</td>
            <td>${c.email}</td>
            <td>${c.message ?? ''}</td>
            <td><span class="status-pill ${statusClass}">${c.status}</span></td>
            <td>${created}</td>
            <td class="actions-cell">
              ${currentRole() === 'ADMIN' ? `
                <button class="btn btn-secondary btn-small edit-btn" data-id="${c.id}">Edit</button>
                <button class="btn btn-danger btn-small delete-btn" data-id="${c.id}">Delete</button>
              ` : '<span style="color:var(--slate); font-family:var(--mono); font-size:12px;">view only</span>'}
            </td>
          `;
          tableBody.appendChild(row);
        });
      }

      pageInfo.textContent = `Page ${currentPage + 1} of ${Math.max(totalPages, 1)}`;
      prevBtn.disabled = currentPage <= 0;
      nextBtn.disabled = currentPage >= totalPages - 1;

      document.querySelectorAll('.edit-btn').forEach(btn =>
        btn.addEventListener('click', () => openEdit(btn.dataset.id)));
      document.querySelectorAll('.delete-btn').forEach(btn =>
        btn.addEventListener('click', () => deleteContact(btn.dataset.id)));

    } catch (err) {
      statusEl.textContent = 'Could not load contacts. Is the backend running?';
      console.error(err);
    }
  }

  // Sorting - click a column header
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.sort;
      if (sortField === field) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortField = field;
        sortDir = 'asc';
      }
      document.querySelectorAll('th.sortable').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
      th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      currentPage = 0;
      loadContacts();
    });
  });

  prevBtn.addEventListener('click', () => { if (currentPage > 0) { currentPage--; loadContacts(); } });
  nextBtn.addEventListener('click', () => { if (currentPage < totalPages - 1) { currentPage++; loadContacts(); } });

  // Add / Edit modal
  document.getElementById('addBtn').addEventListener('click', openCreate);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  function openCreate() {
    modalTitle.textContent = 'Add Contact';
    document.getElementById('contactId').value = '';
    document.getElementById('cname').value = '';
    document.getElementById('cemail').value = '';
    document.getElementById('cmessage').value = '';
    document.getElementById('cstatus').value = 'PENDING';
    clearFieldErrors();
    overlay.classList.add('open');
  }

  function openEdit(id) {
    const c = lastPageData.find(x => String(x.id) === String(id));
    if (!c) return;
    modalTitle.textContent = 'Edit Contact #' + c.id;
    document.getElementById('contactId').value = c.id;
    document.getElementById('cname').value = c.name;
    document.getElementById('cemail').value = c.email;
    document.getElementById('cmessage').value = c.message;
    document.getElementById('cstatus').value = c.status;
    clearFieldErrors();
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors();

    const id = document.getElementById('contactId').value;
    const body = {
      name: document.getElementById('cname').value,
      email: document.getElementById('cemail').value,
      message: document.getElementById('cmessage').value,
      status: document.getElementById('cstatus').value
    };

    const url = id ? `/contacts/${id}` : '/contacts';
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await apiFetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.status === 403) {
        alert("Only an ADMIN can do this - you're logged in as a USER.");
        return;
      }
      if (res.status === 400) {
        const errors = await res.json();
        Object.keys(errors).forEach(field => {
          const el = document.getElementById('err-' + field);
          if (el) el.textContent = errors[field];
        });
        return;
      }
      if (!res.ok) throw new Error('Save failed');

      closeModal();
      loadContacts();
    } catch (err) {
      alert('Could not save contact. Please try again.');
      console.error(err);
    }
  });

  async function deleteContact(id) {
    if (!confirm('Delete contact #' + id + '? This cannot be undone.')) return;
    try {
      const res = await apiFetch(`/contacts/${id}`, { method: 'DELETE' });
      if (res.status === 403) {
        alert("Only an ADMIN can do this - you're logged in as a USER.");
        return;
      }
      if (!res.ok) throw new Error('Delete failed');
      loadContacts();
    } catch (err) {
      alert('Could not delete contact.');
      console.error(err);
    }
  }

  // --- Route guard + role-based UI (Task 6) ---
  requireAuth(); // redirects to /login.html if there's no token at all

  const role = currentRole();
  document.getElementById('whoami').textContent =
    `${localStorage.getItem('username') || ''} (${role || '?'})`;

  // USER role is view-only: hide the actions that require ADMIN.
  if (role !== 'ADMIN') {
    document.getElementById('addBtn').style.display = 'none';
  }

  document.getElementById('logoutBtn').addEventListener('click', logout);

  loadContacts();
</script>

</body>
</html>
