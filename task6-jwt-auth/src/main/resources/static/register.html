<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maincrafts &mdash; Register</title>
<style>
  :root{
    --ink:#0f1720; --blueprint:#12233b; --blueprint-line: rgba(255,255,255,0.06);
    --paper:#f4f1ea; --amber:#e08a2c; --amber-soft:#f2c98e; --slate:#7c8ba1; --red:#e0552c; --green:#4caf7d;
    --display: 'Georgia', 'Iowan Old Style', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--body); color:var(--paper); background:var(--blueprint);
    background-image: linear-gradient(var(--blueprint-line) 1px, transparent 1px), linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 42px 42px; padding:20px;
  }
  .card{width:100%; max-width:380px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:36px;}
  .brand{font-family:var(--mono); letter-spacing:2px; font-size:13px; text-transform:uppercase; color:var(--amber-soft); margin-bottom:24px;}
  .brand span{color:var(--paper); font-weight:bold;}
  h1{font-family:var(--display); font-size:1.8rem; margin:0 0 6px; font-weight:400;}
  .sub{color:var(--slate); font-size:14px; margin-bottom:24px;}
  .field{margin-bottom:18px;}
  label{display:block; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--amber-soft); margin-bottom:7px;}
  input{width:100%; padding:11px 13px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15); border-radius:2px; color:var(--paper); font-family:var(--body); font-size:14px;}
  input:focus{outline:none; border-color:var(--amber);}
  .hint{font-size:11px; color:var(--slate); margin-top:6px; font-family:var(--mono);}
  button{width:100%; padding:13px; border:none; border-radius:2px; background:var(--amber); color:var(--ink); font-weight:600; font-family:var(--mono); font-size:14px; cursor:pointer; margin-top:6px;}
  button:hover{background:var(--amber-soft);}
  #msg{margin-top:14px; font-size:13px; font-family:var(--mono); min-height:18px;}
  .bottom-link{margin-top:20px; text-align:center; font-size:13px; color:var(--slate);}
  .bottom-link a{color:var(--amber-soft); text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>MAIN</span>CRAFTS</div>
    <h1>Create an account</h1>
    <p class="sub">New accounts get the <strong>USER</strong> role (view-only access).</p>

    <form id="registerForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <div class="hint">At least 6 characters</div>
      </div>
      <button type="submit">Register</button>
      <div id="msg"></div>
    </form>

    <div class="bottom-link">Already have an account? <a href="/login.html">Log in</a></div>
  </div>

<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.style.color = 'var(--red)';
    msg.textContent = 'Creating account...';

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || (data.username || data.password) || 'Registration failed.';
        return;
      }

      msg.style.color = 'var(--green)';
      msg.textContent = 'Account created! Redirecting to login...';
      setTimeout(() => window.location.href = '/login.html', 1200);
    } catch (err) {
      msg.textContent = 'Something went wrong. Is the backend running?';
    }
  });
</script>
</body>
</html>
