spring.application.name=task3-contact-dashboard
server.port=8080

# ---- MySQL connection ----
# Create the database first: CREATE DATABASE task3_db;
spring.datasource.url=jdbc:mysql://localhost:3306/task3_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=aditya
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# auto-creates/updates the "contacts" table based on the Contact entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
