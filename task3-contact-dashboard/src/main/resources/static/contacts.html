<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maincrafts &mdash; Contact Dashboard</title>
<style>
  :root{
    --ink:#0f1720;
    --blueprint:#12233b;
    --blueprint-line: rgba(255,255,255,0.06);
    --paper:#f4f1ea;
    --amber:#e08a2c;
    --amber-soft:#f2c98e;
    --slate:#7c8ba1;
    --display: 'Georgia', 'Iowan Old Style', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--body);
    color:var(--paper);
    background:var(--blueprint);
    background-image:
      linear-gradient(var(--blueprint-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 8vw;
  }
  .brand{
    font-family:var(--mono);
    letter-spacing:2px;
    font-size:14px;
    text-transform:uppercase;
    color:var(--amber-soft);
  }
  .brand span{color:var(--paper); font-weight:bold;}
  header a{
    color:var(--slate);
    text-decoration:none;
    font-family:var(--mono);
    font-size:13px;
  }
  header a:hover{color:var(--paper);}

  main{padding:2vh 8vw 8vh;}
  .eyebrow{
    font-family:var(--mono);
    color:var(--amber);
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    border-left:2px solid var(--amber);
    padding-left:12px;
    margin-bottom:20px;
  }
  h1{
    font-family:var(--display);
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    margin:0 0 8px;
    font-weight:400;
  }
  .sub{color:var(--slate); margin-bottom:32px;}

  .table-wrap{
    border:1px solid rgba(255,255,255,0.12);
    border-radius:4px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:rgba(255,255,255,0.02);
  }
  thead th{
    text-align:left;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--amber-soft);
    padding:14px 18px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.03);
  }
  tbody td{
    padding:14px 18px;
    font-size:14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.03);}
  .id-cell{color:var(--slate); font-family:var(--mono);}

  #status{
    font-family:var(--mono);
    font-size:13px;
    color:var(--slate);
    margin-bottom:16px;
  }
  .empty{
    padding:48px;
    text-align:center;
    color:var(--slate);
    font-family:var(--mono);
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span>MAIN</span>CRAFTS</div>
  <a href="/index.html">&larr; Back to landing page</a>
</header>

<main>
  <div class="eyebrow">Full Stack &middot; Task 03</div>
  <h1>Contact Management Dashboard</h1>
  <p class="sub">Every submission from the contact form, fetched live from <code>/contacts</code>.</p>

  <div id="status">Loading contacts&hellip;</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Message</th></tr>
      </thead>
      <tbody id="contactTable"></tbody>
    </table>
  </div>
</main>

<script>
  const statusEl = document.getElementById('status');
  const tableBody = document.getElementById('contactTable');

  fetch('/contacts')
    .then(res => {
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      return res.json();
    })
    .then(data => {
      if (!data.length) {
        statusEl.textContent = 'No contacts submitted yet.';
        return;
      }
      statusEl.textContent = `${data.length} contact${data.length === 1 ? '' : 's'} found.`;
      data.forEach(c => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="id-cell">#${c.id}</td>
          <td>${c.name}</td>
          <td>${c.email}</td>
          <td>${c.message ?? ''}</td>
        `;
        tableBody.appendChild(row);
      });
    })
    .catch(err => {
      statusEl.textContent = 'Could not load contacts. Is the backend running?';
      console.error(err);
    });
</script>

</body>
</html>
